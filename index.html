<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creekside</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Creekside Custom Harvest - job P&amp;L, shop work orders and KPIs">
<meta name="theme-color" content="#1f3d2b">
<!-- iPhone / iPad: icon, name and full-screen when opened from the Home Screen -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creekside">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Android / Chrome: name, icons, standalone -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="robots" content="noindex, nofollow">
<!-- SPEED: open the connections to Google's servers while this page is still starting (saves a handshake each on a weak signal).
     The n-...googleusercontent.com address is this app's own Apps Script sandbox (fixed for this script). -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://n-7mlaaxgq625hnbseogbpgyyqnprxkscvdkwsw3q-0lu-script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  html,body{margin:0;width:100%;height:100%;height:100dvh;background:#1f3d2b;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  /* Pin to the visible area. Use 100dvh (not 100% + left/right/top/bottom together) so Android's toolbar/keyboard don't leave a second scroll area. */
  #app{position:fixed;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);border:0;background:#f2f3f0;
       width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
       height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
       width:calc(100dvw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
       height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  /* Splash (v4): same look as the app's loading bar - green, gold progress bar, soft pulse. Pure CSS, no extra files. */
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
          background:linear-gradient(160deg,#1f3d2b 0%,#2e5c3f 100%);color:#fff;font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;
          transition:opacity .35s ease,transform .35s ease;z-index:2}
  #splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 8px 28px rgba(0,0,0,.28);margin-bottom:10px;animation:pulse 1.8s ease-in-out infinite}
  #splash .t{font-size:26px;font-weight:700;letter-spacing:.01em}
  #splash .s{font-size:14px;opacity:.8;margin-top:-6px}
  #splash .bar{position:relative;width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;margin:14px 0 4px}
  #splash .bar::before{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,#e0a526,transparent);animation:bar 1.15s ease-in-out infinite}
  #splash.gone{opacity:0;transform:scale(1.02);pointer-events:none}
  #splash.hidden{display:none}
  @keyframes pulse{0%,100%{transform:scale(.97);opacity:.85}50%{transform:scale(1);opacity:1}}
  @keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){
    #splash img,#splash .bar::before{animation:none}
    #splash .bar::before{left:30%}
    #splash{transition:opacity .15s linear}
    #splash.gone{transform:none}
  }
  #directLine,#slow{display:none;max-width:320px}
  #directLine a,#slow a{color:#e0a526;font-weight:600}
</style>
</head>
<body>
<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <div class="t">Creekside</div>
  <div class="s">Custom Harvesting</div>
  <div class="bar" role="progressbar" aria-label="Loading Creekside"></div>
  <div id="directLine">On some Android phones the app feels smoother if you <a id="direct" href="#">open it directly</a>.</div>
  <div id="slow">Still loading - weak signal? Keep waiting, or <a id="directSlow" href="#">open it in the browser</a>.</div>
</div>
<iframe id="app" title="Creekside" allow="clipboard-write" referrerpolicy="strict-origin"></iframe>
<script>
  // Apps Script web-app URL (already filled in for the merged Creekside app).
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwF3J3xc1fWhSQ7ieAKK0ti0R5T1yPQy3Zy56-UDAd5gct8WGEZSSqP1gtWaq2xELOsUA/exec';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var android = /Android/i.test(navigator.userAgent);
  function openDirect(e) {
    if (standalone) return;                 // installed home-screen app: stay in this page (a top-level jump to Google leaves the icon and opens a Custom Tab)
    if (e) e.preventDefault();
    location.href = EXEC_URL;               // same tab, not a frame — smoother on some Android phones; the address becomes script.google.com
  }
  document.getElementById('direct').href = EXEC_URL;
  document.getElementById('directSlow').href = EXEC_URL;
  document.getElementById('direct').addEventListener('click', openDirect);
  document.getElementById('directSlow').addEventListener('click', openDirect);
  if (android && !standalone) document.getElementById('directLine').style.display = 'block';
  if (standalone) {                         // last-resort escape if the frame never loads
    document.getElementById('direct').target = '_blank';
    document.getElementById('directSlow').target = '_blank';
    document.getElementById('direct').rel = 'noopener';
    document.getElementById('directSlow').rel = 'noopener';
  }
  if (navigator.onLine === false) { location.replace('offline.html'); }   // no signal at all: say so straight away
  function ready() {   // fade the splash onto the drawn start screen, then take it out of the page
    if (sp.classList.contains('gone')) return;
    sp.classList.add('gone');
    setTimeout(function () { sp.classList.add('hidden'); }, 450);
  }
  f.addEventListener('load', ready);
  // The start screen says when it is up (a little before the frame's own 'load', which also waits for Google's extras).
  window.addEventListener('message', function (e) {
    if (e.data === 'creekside-ready' && /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) ready();
  });
  setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 12000);
  f.src = EXEC_URL;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
