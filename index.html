<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creekside</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Creekside Custom Harvest - job P&amp;L, shop work orders and KPIs">
<meta name="theme-color" content="#1f3d2b">
<!-- iPhone / iPad: icon, name and full-screen when opened from the Home Screen -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creekside">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Android / Chrome: name, icons, standalone -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="robots" content="noindex, nofollow">
<style>
  html,body{margin:0;height:100%;background:#1f3d2b;overflow:hidden}
  /* The green bar behind the phone's status bar / notch, and below the home indicator. */
  #app{position:fixed;left:env(safe-area-inset-left);right:env(safe-area-inset-right);
       top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);border:0;background:#f2f3f0;
       width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
       height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
          background:#1f3d2b;color:#fff;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;transition:opacity .3s}
  #splash img{width:120px;height:120px;border-radius:26px}
  #splash.gone{opacity:0;pointer-events:none}
  #slow{display:none;max-width:320px}
  #slow a{color:#e0a526;font-weight:600}
</style>
</head>
<body>
<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <div>Loading Creekside&hellip;</div>
  <div id="slow">Still loading - weak signal? Keep waiting, or <a id="direct" href="#" target="_blank" rel="noopener">open it in the browser</a>.</div>
</div>
<iframe id="app" title="Creekside" allow="clipboard-write" referrerpolicy="strict-origin"></iframe>
<script>
  // Apps Script web-app URL (already filled in for the merged Creekside app).
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwF3J3xc1fWhSQ7ieAKK0ti0R5T1yPQy3Zy56-UDAd5gct8WGEZSSqP1gtWaq2xELOsUA/exec';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  document.getElementById('direct').href = EXEC_URL;
  f.addEventListener('load', function () { sp.classList.add('gone'); });
  setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 12000);
  f.src = EXEC_URL;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
