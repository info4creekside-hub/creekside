<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Creekside</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Creekside Custom Harvest - job P&amp;L, shop work orders and KPIs">
<meta name="theme-color" content="#1f3d2b">
<!-- iPhone / iPad: icon, name and full-screen when opened from the Home Screen -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creekside">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Android / Chrome: name, icons, standalone -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="robots" content="noindex, nofollow">
<style>
  html,body{margin:0;width:100%;height:100%;height:100dvh;background:#1f3d2b;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  /* Pin to the visible area. Use 100dvh (not 100% + left/right/top/bottom together) so Android's toolbar/keyboard don't leave a second scroll area. */
  #app{position:fixed;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);border:0;background:#f2f3f0;
       width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
       height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
       width:calc(100dvw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
       height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
          background:#1f3d2b;color:#fff;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;transition:opacity .3s}
  #splash img{width:120px;height:120px;border-radius:26px}
  #splash.gone{opacity:0;pointer-events:none}
  #directLine,#slow{display:none;max-width:320px}
  #directLine a,#slow a{color:#e0a526;font-weight:600}
</style>
</head>
<body>
<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <div>Loading Creekside&hellip;</div>
  <div id="directLine">On some Android phones the app feels smoother if you <a id="direct" href="#">open it directly</a>.</div>
  <div id="slow">Still loading - weak signal? Keep waiting, or <a id="directSlow" href="#">open it in the browser</a>.</div>
</div>
<iframe id="app" title="Creekside" allow="clipboard-write" referrerpolicy="strict-origin"></iframe>
<script>
  // Apps Script web-app URL (already filled in for the merged Creekside app).
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwF3J3xc1fWhSQ7ieAKK0ti0R5T1yPQy3Zy56-UDAd5gct8WGEZSSqP1gtWaq2xELOsUA/exec';
  var f = document.getElementById('app'), sp = document.getElementById('splash');
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  var android = /Android/i.test(navigator.userAgent);
  function openDirect(e) {
    if (standalone) return;                 // installed home-screen app: stay in this page (a top-level jump to Google leaves the icon and opens a Custom Tab)
    if (e) e.preventDefault();
    location.href = EXEC_URL;               // same tab, not a frame — smoother on some Android phones; the address becomes script.google.com
  }
  document.getElementById('direct').href = EXEC_URL;
  document.getElementById('directSlow').href = EXEC_URL;
  document.getElementById('direct').addEventListener('click', openDirect);
  document.getElementById('directSlow').addEventListener('click', openDirect);
  if (android && !standalone) document.getElementById('directLine').style.display = 'block';
  if (standalone) {                         // last-resort escape if the frame never loads
    document.getElementById('direct').target = '_blank';
    document.getElementById('directSlow').target = '_blank';
    document.getElementById('direct').rel = 'noopener';
    document.getElementById('directSlow').rel = 'noopener';
  }
  f.addEventListener('load', function () { sp.classList.add('gone'); });
  setTimeout(function () { document.getElementById('slow').style.display = 'block'; }, 12000);
  f.src = EXEC_URL;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
